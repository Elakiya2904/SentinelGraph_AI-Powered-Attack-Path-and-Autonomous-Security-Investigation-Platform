apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelgraph.fullname" . }}-backend
  labels:
    {{- include "sentinelgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "sentinelgraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
