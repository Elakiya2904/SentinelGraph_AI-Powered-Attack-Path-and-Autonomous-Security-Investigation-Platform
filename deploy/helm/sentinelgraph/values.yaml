fullnameOverride: sentinelgraph

backend:
  image:
    repository: sentinelgraph/backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8000
  resources: {}

frontend:
  image:
    repository: sentinelgraph/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8080
  resources: {}
  writableVolumes:
    - name: nginx-tmp
      mountPath: /tmp
    - name: nginx-cache
      mountPath: /var/cache/nginx
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sentinelgraph.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
